
{% extends 'base.html' %}

{% block titulo %}Cadastrar Instituição{% endblock %}

{% block conteudo %}

<section class="auth">
    <h2>Cadastrar Instituição</h2>
    <p>Cadastre sua instituição para gerenciar pedidos de ajuda.</p>

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <form action="{{ url_for('instituicoes.cadastro') }}" method="POST">

        <label for="nome">Nome da instituição:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            maxlength="100"
            placeholder="Nome da instituição"
            required
        >

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            maxlength="80"
            placeholder="Email da instituição"
            required
        >

        <label for="cnpj">CNPJ:</label>
        <input
            type="text"
            id="cnpj"
            name="cnpj"
            maxlength="18"
            placeholder="00.000.000/0000-00"
            required
        >

        <label for="senha">Senha:</label>
        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Crie uma senha"
            required
        >

        <button type="submit">Cadastrar Instituição</button>

    </form>
</section>

{% endblock %}
