<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Início{% endblock %} - DarMais</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('index.index') }}">DarMais</a>
    <nav>
      <a href="{{ url_for('index.index') }}">Início</a>
      {% if not session.get('user_id') %}
      <a href="{{ url_for('auth.login') }}">Entrar</a>
      <a href="{{ url_for('auth.cadastro') }}">Cadastrar</a>
      {% endif %}
      {% if session.get("user_id") %}
      <a href="{{ url_for('auth.logout') }}">Sair</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block conteudo %}{% endblock %}
  </main>

  <footer>
    <p>DarMais &copy; 2026</p>
  </footer>

</body>
</html>
