{% extends 'base.html' %}

{% block titulo %}Início{% endblock %}

{% block conteudo %}
  <section class="hero">
    <h1>Faça a diferença</h1>
  </section>

  <h2>Instituições Beneficiadas</h2>
  <div class="cards">
    {% for inst in instituicoes %}
      <div class="card">
        <h3>{{ inst.nome }}</h3>
        <p>{{ inst.descricao }}</p>
        <button type="button">Doar</button>
      </div>
    {% endfor %}
  </div>
{% endblock %}
